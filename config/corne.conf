# Sleep Configuration
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Wireless/Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# ZMK Studio Support (disabled - causes stale settings issues)
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n

# Keyboard Name
CONFIG_ZMK_KEYBOARD_NAME="Corne View"

# Mouse Support
CONFIG_ZMK_POINTING=y

# KeyBeacon — layer/mods/connectivity/battery over the host BLE link (KBP 1.2).
# Left half is central (ZMK default for corne_left), so the module links there;
# the right half compiles it out via the module's own cmake guard.
CONFIG_ZMK_KEYBEACON=y
CONFIG_ZMK_KEYBEACON_CONNECTIVITY=y
CONFIG_ZMK_KEYBEACON_BATTERY=y
CONFIG_ZMK_KEYBEACON_HOST_LINK=y

# Let the central read the peripheral half's battery level, so the KeyBeacon
# Battery characteristic can report both halves. ZMK default is n.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
