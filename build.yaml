# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view
    # Workaround for zmk-keybeacon v1.2.0: its compat probe finds the legacy
    # zmk_endpoints_selected() here but drops the resulting compile definition
    # (upstream add_compile_definitions scope bug), so pass it ourselves.
    # Drop this line after moving to a ZMK rev with zmk_endpoint_get_selected().
    cmake-args: -DEXTRA_CFLAGS=-DZMK_KEYBEACON_HAS_LEGACY_ENDPOINT=1

  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view
